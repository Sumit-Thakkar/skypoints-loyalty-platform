version: 2

models:

  # ── India Country Mart ──────────────────────────────────────────────────────
  - name: table_india
    description: >
      Curated Gold mart for members located in India (Deliverable 3).
      Filtered from STAGING.STG_MEMBERS where COUNTRY = 'IND'.
      Enforces the "latest record wins" rule.
    columns:
      - name: MEMBER_ID
        description: "Unique loyalty member ID in India."
        tests:
          - unique
          - not_null
      - name: COUNTRY
        description: "Country code. Strictly 'IND'."
        tests:
          - not_null
          - accepted_values:
              values: ['IND']

