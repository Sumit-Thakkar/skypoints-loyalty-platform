name: 'skypoints_loyalty'
version: '1.0.0'
config-version: 2

profile: 'skypoints_profile'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

seed-paths: ["seeds"]

clean-targets:
  - "target"
  - "dbt_packages"

# Model layers configuration
models:
  skypoints_loyalty:
    raw:
      +materialized: incremental
      +schema: RAW
    staging:
      +materialized: table
      +schema: STAGING
    quarantine:
      +materialized: incremental
      +schema: QUARANTINE
    marts:
      +materialized: table
      +schema: MARTS

# Seeds configuration
seeds:
  skypoints_loyalty:
    +schema: STAGING
    country_mapping:
      +column_types:
        raw_country_code: VARCHAR(10)
        standard_country_code: VARCHAR(3)
        country_name: VARCHAR(50)

